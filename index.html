<script>
/* =====================================================================
   OlahIUT - Pengolahan Ilmu Ukur Tanah (Vanilla JS)
   ===================================================================== */
const D2R = Math.PI / 180;
const $ = id => document.getElementById(id);

/* ---------- Konfigurasi menu ---------- */
const MODES = {
  titik:    { min: 1, label: 'titik',
              desc: 'Menghitung Jarak Optis (miring & datar), Beda Tinggi (H), Elevasi (Δh) dan koordinat titik. Acuan Utara = 0 set, sehingga bacaan H dipakai sebagai azimuth.' },
  terbuka:  { min: 1, label: 'sisi',
              desc: 'Menghitung Jarak Datar, Azimuth (α) dan koordinat poligon terbuka; H bisa berupa bacaan backsight atau sudah azimuth. Jumlah baris = jumlah sisi (titik yang dihasilkan = sisi + 1).' },
  tertutup: { min: 3, label: 'titik',
              desc: 'Mengolah bidikan belakang (backsight) & depan (foresight) pada poligon yang kembali ke titik awal: sudut dalam, koreksi, azimuth, koreksi keliling, koordinat, dan luas.' }
};
let mode = 'titik';
let lastPlot = null;

/* ---------- Utilitas sudut & angka ---------- */
// Membaca sudut: desimal "123.45" atau DMS "123 27 24" / 123°27'24"
function ang(s) {
  const str = String(s ?? '').trim();
  const m = str.replace(',', '.').match(/\d+(\.\d+)?/g);
  if (!m) return NaN;
  const v = m.map(Number);
  return (str.startsWith('-') ? -1 : 1) * (v[0] + (v[1] || 0) / 60 + (v[2] || 0) / 3600);
}
// Membaca angka biasa (koma dianggap desimal)
const num = s => { const t = String(s ?? '').trim().replace(',', '.'); return t === '' ? NaN : Number(t); };
// Normalisasi sudut ke rentang 0..360
const norm = a => ((a % 360) + 360) % 360;
// Format derajat -> D°MM'SS"
function dms(a) {
  if (!isFinite(a)) return '-';
  const s = Math.round(Math.abs(a) * 3600);
  const d = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
  return (a < 0 ? '-' : '') + d + '°' + String(m).padStart(2, '0') + "'" + String(sc).padStart(2, '0') + '"';
}
const f = (x, k = 3) => isFinite(x) ? x.toFixed(k) : '-';

/* ---------- Rumus dasar tachymetri ---------- */
// D miring = (BA-BB)·100·cos(90°-V)
const dMiring = (ba, bb, v) => (ba - bb) * 100 * Math.cos((90 - v) * D2R);
// D datar  = (BA-BB)·100·cos²(90°-V)
const dDatar  = (ba, bb, v) => (ba - bb) * 100 * Math.cos((90 - v) * D2R) ** 2;
// Beda tinggi H = 100·(BA-BB)·cos(90°-V)·sin(90°-V)
const bedaTinggi = (ba, bb, v) => 100 * (ba - bb) * Math.cos((90 - v) * D2R) * Math.sin((90 - v) * D2R);

/* ---------- Tabel input dinamis ---------- */
// Target tiap titik pada poligon tertutup (2 baris per titik), i = indeks titik (0-based)
// Titik 1: [depan=2, belakang=n]; titik lain: [belakang=i, depan=i+2 (atau 1 untuk titik terakhir)]
function targets(i, n) {
  if (i === 0) return [{ t: 2, role: 'depan' }, { t: n, role: 'belakang' }];
  return [{ t: i, role: 'belakang' }, { t: i + 2 > n ? 1 : i + 2, role: 'depan' }];
}
// Mengambil seluruh isi sel input (array baris x kolom, berupa string)
const readCells = () => [...document.querySelectorAll('#tbody tr')].map(tr => [...tr.querySelectorAll('input')].map(i => i.value.trim()));

// Membangun ulang tabel sesuai menu dan jumlah titik. keep=true mempertahankan isian lama.
function buildTable(keep) {
  const cfg = MODES[mode];
  const n = Math.max(cfg.min, Math.min(50, parseInt($('n').value) || cfg.min));
  const old = keep ? readCells() : [];
  const nc = mode === 'terbuka' ? 5 : 6;                       // poligon terbuka tanpa kolom TA
  const lead = mode === 'tertutup' ? ['Titik', 'Target'] : [mode === 'terbuka' ? 'Sisi' : 'Titik'];
  const names = ['BA', 'BT', 'BB', 'V (°)', 'H (°)', 'TA (m)'].slice(0, nc);
  $('thead').innerHTML = '<tr>' + [...lead, ...names].map(h => `<th class="px-2 py-2 border-b font-semibold">${h}</th>`).join('') + '</tr>';

  let html = '';
  const rows = mode === 'tertutup' ? 2 * n : n;
  for (let k = 0; k < rows; k++) {
    let td = '';
    if (mode === 'tertutup') {
      const i = Math.floor(k / 2), t = targets(i, n)[k % 2];
      if (k % 2 === 0) td += `<td rowspan="2" class="px-2 border-b font-semibold bg-slate-50">${i + 1}</td>`;
      td += `<td class="px-2 py-1 border-b whitespace-nowrap">${t.t} <span class="text-xs text-slate-400">(${t.role})</span></td>`;
    } else {
      td += `<td class="px-2 py-1 border-b font-semibold bg-slate-50">${mode === 'terbuka' ? (k + 1) + '-' + (k + 2) : k + 1}</td>`;
    }
    for (let c = 0; c < nc; c++) {
      const v = String(old[k]?.[c] ?? '').replace(/"/g, '&quot;');
      td += `<td class="px-1 py-1 border-b"><input data-r="${k}" data-c="${c}" value="${v}" inputmode="decimal" class="w-24 border rounded px-2 py-1 text-center focus:outline-none focus:ring-2 focus:ring-gold-400"></td>`;
    }
    html += `<tr class="${mode === 'tertutup' && k % 2 === 1 ? 'border-b-4 border-slate-100' : ''}">${td}</tr>`;
  }
  $('tbody').innerHTML = html;
}

/* ---------- Validasi & pembacaan data ---------- */
// Mengubah isi sel menjadi objek numerik per baris, sekaligus memvalidasi kolom wajib
function parseRows(cells) {
  const names = ['BA', 'BT', 'BB', 'V', 'H', 'TA'];
  const req = mode === 'titik' ? [0, 1, 2, 3, 4, 5] : [0, 2, 3, 4];
  return cells.map((r, k) => {
    const o = { ba: num(r[0]), bt: num(r[1]), bb: num(r[2]), v: ang(r[3]), h: ang(r[4]), ta: num(r[5]) };
    const vals = [o.ba, o.bt, o.bb, o.v, o.h, o.ta];
    req.forEach(c => { if (!isFinite(vals[c])) throw new Error(`Baris ${k + 1}: kolom ${names[c]} belum diisi atau tidak valid.`); });
    if (o.ba <= o.bb) throw new Error(`Baris ${k + 1}: BA harus lebih besar dari BB.`);
    return o;
  });
}

/* ---------- 1) PENGUKURAN TITIK ---------- */
function calcTitik(R, x0, y0) {
  let x = x0, y = y0;
  const rows = [], pts = [{ l: 'Awal', x, y }];
  R.forEach((r, i) => {
    const dm = dMiring(r.ba, r.bb, r.v), dd = dDatar(r.ba, r.bb, r.v), bH = bedaTinggi(r.ba, r.bb, r.v);
    const sel = bH - r.bt;                                           // H - BT
    const elev = sel < 0 ? r.ta - Math.abs(sel) : r.ta + sel;        // Δh = TA - |H-BT| jika minus, TA + (H-BT) jika plus
    const a = norm(r.h);                                             // acuan Utara: H = azimuth
    x += dd * Math.sin(a * D2R); y += dd * Math.cos(a * D2R);        // Xn = Xn-1 + D sin α ; Yn = Yn-1 + D cos α
    pts.push({ l: String(i + 1), x, y });
    rows.push([i + 1, f(dm), f(dd), f(bH), f(sel), f(elev), dms(a), f(x), f(y)]);
  });
  const html = card('Jarak Optis, Beda Tinggi, Elevasi & Koordinat',
    tbl(['Titik', 'D Miring (m)', 'D Datar (m)', 'Beda Tinggi H (m)', 'H − BT', 'Elevasi Δh (m)', 'Azimuth α', 'X (m)', 'Y (m)'], rows));
  return { html, plot: { pts, closed: false } };
}

/* ---------- 2) POLIGON TERBUKA ---------- */
// metode: 'backsight' = H berreferensi titik sebelumnya (H pertama = azimuth awal)
//         'azimuth'   = semua H sudah berupa azimuth
function calcTerbuka(R, x0, y0, metode) {
  let x = x0, y = y0, a = 0;
  const rows = [], pts = [{ l: '1', x, y }];
  R.forEach((r, i) => {
    const dd = dDatar(r.ba, r.bb, r.v);
    a = (i === 0 || metode === 'azimuth') ? norm(r.h)                // α awal = H pertama (atau semua H jika sudah azimuth)
                                          : norm(a - 180 + r.h);     // backsight: αn = αn-1 − 180° + H
    const dx = dd * Math.sin(a * D2R), dy = dd * Math.cos(a * D2R);
    x += dx; y += dy;
    pts.push({ l: String(i + 2), x, y });
    rows.push([`${i + 1}-${i + 2}`, f(dd), dms(r.h), dms(a), f(dx), f(dy), i + 2, f(x), f(y)]);
  });
  const html = card('Jarak Datar, Azimuth & Koordinat',
    tbl(['Sisi', 'D Datar (m)', 'H', 'Azimuth α', 'ΔX (m)', 'ΔY (m)', 'Titik', 'X (m)', 'Y (m)'], rows));
  return { html, plot: { pts, closed: false } };
}

/* ---------- 3) POLIGON TERTUTUP ---------- */
function calcTertutup(R, x0, y0, metode) {
  const n = R.length / 2;
  if (n < 3) throw new Error('Poligon tertutup minimal 3 titik.');
  // Ambil baris belakang/depan tiap titik (titik 1: baris0 = depan, baris1 = belakang; lainnya kebalikannya)
  const dep = i => R[2 * i + (i === 0 ? 0 : 1)], bel = i => R[2 * i + (i === 0 ? 1 : 0)];

  // --- Langkah 1: Jarak datar sisi i → i+1 = rata-rata bidikan depan di i & belakang di i+1 (pergi-pulang)
  const dP = [], dQ = [], D = [];
  for (let i = 0; i < n; i++) {
    const p = dDatar(dep(i).ba, dep(i).bb, dep(i).v), q = dDatar(bel((i + 1) % n).ba, bel((i + 1) % n).bb, bel((i + 1) % n).v);
    dP.push(p); dQ.push(q); D.push((p + q) / 2);
  }
  const sumD = D.reduce((s, v) => s + v, 0);

  // --- Langkah 2-4: sudut dalam, koreksi, azimuth
  let beta = [], betaK = [], alpha = [], html = '', sumB = 0, fB = 0, closeAz = '';
  if (metode === 'sudut') {
    beta = Array.from({ length: n }, (_, i) => {
      const hb = norm(bel(i).h), hd = norm(dep(i).h);
      return hd > hb ? hb - hd + 360 : hb - hd;                      // β = Hb − Hd (+360° jika Hd lebih besar)
    });
    sumB = beta.reduce((s, v) => s + v, 0);
    const target = (n - 2) * 180;
    fB = sumB - target;
    betaK = beta.map(b => b + (target - sumB) / n);                  // β' = β + ((n−2)·180° − Σβ)/n
    alpha[0] = norm(dep(0).h);                                       // azimuth awal = H awal
    for (let i = 1; i < n; i++) alpha[i] = norm(alpha[i - 1] + 180 - betaK[i]);   // αn = αn-1 + 180° − β'
    closeAz = norm(alpha[n - 1] + 180 - betaK[0]);                   // pengecekan: harus kembali ke α awal
    html += card('Sudut Dalam & Koreksi', tbl(['Titik', 'H belakang', 'H depan', 'β', 'Koreksi', "β'"],
      beta.map((b, i) => [i + 1, dms(norm(bel(i).h)), dms(norm(dep(i).h)), dms(b), f((target - sumB) / n * 3600, 1) + '"', dms(betaK[i])])
        .concat([['Σ', '', '', dms(sumB), '', dms(betaK.reduce((s, v) => s + v, 0))]])));
  } else {
    for (let i = 0; i < n; i++) alpha[i] = norm(dep(i).h);           // metode azimuth langsung: H = azimuth sisi i→i+1
  }

  // --- Langkah 5: selisih koordinat, kesalahan keliling, koreksi proporsional
  const dX = D.map((d, i) => d * Math.sin(alpha[i] * D2R)), dY = D.map((d, i) => d * Math.cos(alpha[i] * D2R));
  const sX = dX.reduce((s, v) => s + v, 0), sY = dY.reduce((s, v) => s + v, 0);
  // f(x) = X_akhir − X_awal − ΣΔX  (poligon tertutup: X_akhir = X_awal). Idem f(y).
  const fx = 0 - sX, fy = 0 - sY;
  // Koreksi sisi = (D/ΣD)·f. Tanda dipilih agar ΣΔX' = 0 (poligon benar-benar menutup).
  const dXk = dX.map((v, i) => v + D[i] / sumD * fx), dYk = dY.map((v, i) => v + D[i] / sumD * fy);

  // Koordinat akhir: Xn = Xn-1 + ΔX terkoreksi
  const pts = [{ l: '1', x: x0, y: y0 }];
  for (let i = 0; i < n - 1; i++) pts.push({ l: String(i + 2), x: pts[i].x + dXk[i], y: pts[i].y + dYk[i] });

  // --- Langkah 6: luas (Gauss / Shoelace) = ½|Σ Xi (Yi+1 − Yi−1)|
  let s = 0;
  for (let i = 0; i < n; i++) s += pts[i].x * (pts[(i + 1) % n].y - pts[(i - 1 + n) % n].y);
  const luas = Math.abs(s) / 2;

  html += card('Jarak, Azimuth & Koordinat Terkoreksi', tbl(
    ['Sisi', 'D pergi', 'D pulang', 'D rata-rata', 'Azimuth α', 'ΔX', 'ΔY', "ΔX'", "ΔY'", 'Titik', 'X (m)', 'Y (m)'],
    D.map((d, i) => [`${i + 1}-${(i + 1) % n + 1}`, f(dP[i]), f(dQ[i]), f(d), dms(alpha[i]), f(dX[i]), f(dY[i]), f(dXk[i]), f(dYk[i]),
      (i + 1) % n + 1, f((i + 1 < n ? pts[i + 1] : pts[0]).x), f((i + 1 < n ? pts[i + 1] : pts[0]).y)])));

  const fl = Math.hypot(fx, fy);
  const kv = (k, v) => `<div class="kv bg-slate-50 border rounded-lg p-2"><div class="text-xs text-slate-500">${k}</div><div class="font-semibold">${v}</div></div>`;
  html += card('Ringkasan', `<div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
    ${kv('ΣD (keliling)', f(sumD) + ' m')}${kv('ΣΔX / ΣΔY', f(sX, 4) + ' / ' + f(sY, 4))}
    ${kv('f(x) / f(y)', f(fx, 4) + ' / ' + f(fy, 4))}${kv('Ketelitian linear', fl > 1e-9 ? '1 : ' + Math.round(sumD / fl) : 'sempurna')}
    ${metode === 'sudut' ? kv('Σβ (seharusnya ' + (n - 2) * 180 + '°)', dms(sumB)) + kv('Kesalahan sudut fβ', f(fB * 3600, 1) + '"') + kv('Cek azimuth awal', dms(closeAz) + ' (awal ' + dms(alpha[0]) + ')') : ''}
    <div class="kv bg-emerald-50 border border-emerald-200 rounded-lg p-2 col-span-2"><div class="text-xs text-emerald-700">Luas Area</div><div class="font-bold text-emerald-800 text-lg">${f(luas)} m² <span class="text-sm font-normal">(${f(luas / 10000, 4)} ha)</span></div></div>
  </div>`);
  return { html, plot: { pts, closed: true, luas } };
}

/* ---------- Helper tampilan hasil ---------- */
const tbl = (h, rows) => `<div class="overflow-x-auto"><table class="min-w-full text-sm text-center border border-slate-200"><thead class="bg-navy-800 text-white"><tr>${h.map(x => `<th class="px-2 py-1.5 border border-slate-200">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="odd:bg-white even:bg-navy-50">${r.map(x => `<td class="px-2 py-1 border border-slate-200 whitespace-nowrap">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const card = (t, body) => `<div class="space-y-2"><h3 class="font-semibold text-navy-800 border-l-4 border-gold-500 pl-2">${t}</h3>${body}</div>`;

/* ---------- Visualisasi Canvas 2D (X = Timur, Y = Utara) ---------- */
function draw() {
  if (!lastPlot) return;
  const { pts, closed } = lastPlot, cv = $('cv'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = Math.round(Math.min(W * 0.75, 560));
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y), pad = 70;
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const rx = (maxX - minX) || 1, ry = (maxY - minY) || 1;
  const s = Math.min((W - 2 * pad) / rx, (H - 2 * pad) / ry);        // skala sama untuk X & Y
  const ox = pad + ((W - 2 * pad) - rx * s) / 2, oy = pad + ((H - 2 * pad) - ry * s) / 2;
  const tx = x => ox + (x - minX) * s, ty = y => H - (oy + (y - minY) * s);

  // Grid + label sumbu
  const step = (v => { const p = 10 ** Math.floor(Math.log10(v)), m = v / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; })(Math.max(rx, ry) / 5);
  g.strokeStyle = '#e2e8f0'; g.fillStyle = '#94a3b8'; g.font = '10px sans-serif'; g.lineWidth = 1;
  g.textAlign = 'center';
  for (let v = Math.ceil((minX - ox / s) / step) * step; tx(v) < W; v += step) { if (tx(v) < 0) continue; g.beginPath(); g.moveTo(tx(v), 0); g.lineTo(tx(v), H); g.stroke(); g.fillText(+v.toFixed(2), tx(v), H - 4); }
  g.textAlign = 'left';
  for (let v = Math.ceil((minY - oy / s) / step) * step; ty(v) > 0; v += step) { if (ty(v) > H) continue; g.beginPath(); g.moveTo(0, ty(v)); g.lineTo(W, ty(v)); g.stroke(); g.fillText(+v.toFixed(2), 4, ty(v) - 3); }

  // Jalur / bidang
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(tx(p.x), ty(p.y)) : g.moveTo(tx(p.x), ty(p.y)));
  if (closed) { g.closePath(); g.fillStyle = 'rgba(242,176,30,.16)'; g.fill(); }
  g.strokeStyle = '#1f3c64'; g.lineWidth = 2.5; g.stroke();

  // Titik + label koordinat
  pts.forEach((p, i) => {
    g.beginPath(); g.arc(tx(p.x), ty(p.y), 5, 0, 7);
    g.fillStyle = i === 0 ? '#16a34a' : '#e11d48'; g.fill();
    g.fillStyle = '#0f172a'; g.font = 'bold 12px sans-serif'; g.textAlign = 'left'; g.fillText(p.l, tx(p.x) + 8, ty(p.y) - 8);
    g.fillStyle = '#475569'; g.font = '10px sans-serif'; g.fillText(`(${f(p.x, 2)}, ${f(p.y, 2)})`, tx(p.x) + 8, ty(p.y) + 5);
  });

  // Penunjuk arah Utara
  g.strokeStyle = '#334155'; g.fillStyle = '#334155'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(W - 30, 62); g.lineTo(W - 30, 22); g.lineTo(W - 36, 32); g.moveTo(W - 30, 22); g.lineTo(W - 24, 32); g.stroke();
  g.font = 'bold 12px sans-serif'; g.textAlign = 'center'; g.fillText('U', W - 30, 78);
}
window.addEventListener('resize', draw);

// Menyimpan salinan data input + parameter saat tombol Hitung ditekan
function snapshot(x0, y0) {
  const cells = readCells(), n = mode === 'tertutup' ? cells.length / 2 : cells.length;

  const head = [mode === 'tertutup' ? 'Titik' : mode === 'terbuka' ? 'Sisi' : 'Titik'].concat(mode === 'tertutup' ? ['Target'] : [],

    return [mode === 'terbuka' ? `${k + 1}-${k + 2}` : k + 1, ...r];

               : '-';

  sm.rows.forEach((r, k) => r.forEach((v, c) => { const el = document.querySelector(`input[data-r="${k}"][data-c="${c}"]`); if (el) el.value = v; }));
};
$('btnReset').onclick = () => { $('x0').value = ''; $('y0').value = ''; $('result').classList.add('hidden'); $('err').classList.add('hidden'); buildTable(false); };

$('btnHitung').onclick = () => {
  $('err').classList.add('hidden');
  try {
    const x0 = isFinite(num($('x0').value)) ? num($('x0').value) : 0;   // default 0 jika kosong
    const y0 = isFinite(num($('y0').value)) ? num($('y0').value) : 0;
    const R = parseRows(readCells());
    const res = mode === 'titik' ? calcTitik(R, x0, y0)
              : mode === 'terbuka' ? calcTerbuka(R, x0, y0, document.querySelector('input[name=metodeT]:checked').value)
              : calcTertutup(R, x0, y0, document.querySelector('input[name=metode]:checked').value);
    $('out').innerHTML = res.html; lastPlot = res.plot;
    lastMeta = snapshot(x0, y0);
    $('result').classList.remove('hidden');
    draw(); $('result').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { $('err').textContent = e.message; $('err').classList.remove('hidden'); }
};

$('btnExcel').onclick = exportExcel;
$('btnPdf').onclick = exportPDF;
setMode('titik');   // tampilan awal
</script>
</body>
</html>
